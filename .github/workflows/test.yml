name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: 單元測試（覆蓋率 100%）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - name: 上傳覆蓋率報告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  mutation:
    name: 變異測試 ${{ matrix.shard }}（Stryker 100 分）
    # 不等單元測試：測試壞掉時 Stryker 的初始測試也會在幾秒內失敗
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lib
            mutate: lib/**/*.js
          - shard: content
            mutate: content.js
          - shard: review
            mutate: review.js
          - shard: pages
            mutate: background.js,options.js,popup.js
    env:
      INCREMENTAL_FILE: reports/stryker-incremental-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # 增量模式：沿用上次的結果，只重測程式碼或測試有變動的 mutant
      - name: 還原增量結果
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: stryker-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.shard }}-
      - run: npm run mutation -- --mutate "${{ matrix.mutate }}" --incrementalFile "$INCREMENTAL_FILE"
      - name: 保存增量結果
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: stryker-${{ matrix.shard }}-${{ github.sha }}
      - name: 上傳變異測試報告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: ignore
